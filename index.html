<style>
:root {

  --fg: #ececec; --fg-2: #a8a8a8; --fg-3: #7a7a7a;
  --line: #363636; --accent: #7cacf8; --danger: #f28b82; --danger-bg: #3c2322;

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.65 var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }

/* Layout */
#app { display: flex; height: 100vh; height: 100dvh; padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left); }
#side { width: 260px; flex: none; display: flex; flex-direction: column; background: var(--bg-2); border-right: 1px solid var(--line); transition: margin-left .2s ease, transform .2s ease; }

.brand { font-weight: 600; font-size: 16px; }
.side-search { padding: 0 10px 8px; }

.chat-item.active { background: var(--bg-3); }
.chat-item .t { display: block; flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 14px; text-align: left; }

header { flex: none; display: flex; align-items: center; gap: 2px; height: 52px; padding: 0 8px; margin-top: env(safe-area-inset-top); }
.icon-btn { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 8px; color: var(--fg-2); }
.icon-btn:hover { background: var(--hover); color: var(--fg); }
.model-wrap { position: relative; display: flex; align-items: center; min-width: 0; margin-right: auto; }
#model-select { min-width: 0; max-width: 100%; height: 36px; padding: 0 30px 0 10px; border: 0; border-radius: 8px; background: transparent; font-size: 15px; font-weight: 600; text-overflow: ellipsis; cursor: pointer; appearance: none; -webkit-appearance: none; outline: none; }
#model-select:hover, #model-select:focus-visible { background: var(--hover); }

/* Messages */
#scroller { flex: 1; overflow-y: auto; overscroll-behavior: contain; }

.meta { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.err { margin-top: 6px; padding: 8px 12px; border-radius: 8px; background: var(--danger-bg); color: var(--danger); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.notice { margin-top: 8px; font-size: 13px; color: var(--fg-3); }
.typing { display: flex; gap: 5px; height: 26px; align-items: center; }
.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-3); animation: blink 1.2s infinite both; }
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
.edit-box textarea { width: 100%; min-height: 80px; max-height: 50vh; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); resize: vertical; outline: none; line-height: 1.55; }
.edit-box textarea:focus { border-color: var(--fg-3); }
.edit-box .row { justify-content: flex-end; margin-top: 8px; }
details.think { margin-bottom: 10px; font-size: 14px; color: var(--fg-2); }
details.think > summary { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; list-style: none; user-select: none; -webkit-user-select: none; color: var(--fg-3); }
details.think > summary::-webkit-details-marker { display: none; }

@keyframes pulse { 50% { opacity: .4; } }
.think-body { margin-top: 6px; padding: 0 0 0 12px; border-left: 2px solid var(--line); }
.empty { min-height: 55vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; color: var(--fg-2); }
.empty h2 { margin: 0; color: var(--fg); font-size: 24px; font-weight: 600; }
.empty p { margin: 0 0 12px; }
#to-bottom { position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, -12px); border: 1px solid var(--line); border-radius: 50%; background: var(--bg); box-shadow: 0 2px 8px rgba(0,0,0,.1); }

/* Markdown */
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md blockquote, .md .table-wrap, .md .code, .md .math-block { margin: .75em 0; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 1.3em 0 .55em; line-height: 1.35; font-weight: 600; }
.md h1 { font-size: 1.5em; } .md h2 { font-size: 1.3em; } .md h3 { font-size: 1.15em; } .md h4, .md h5, .md h6 { font-size: 1em; }
.md ul, .md ol { padding-left: 1.6em; }
.md li { margin: .3em 0; }
.md li > p { margin: .3em 0; }
.md li > ul, .md li > ol { margin: .3em 0; }
.md li.task { list-style: none; }
.md li.task > input:first-child { margin: 0 .45em 0 -1.4em; vertical-align: -1px; }
.md blockquote { margin-left: 0; margin-right: 0; padding: 0 1em; border-left: 3px solid var(--line); color: var(--fg-2); }
.md hr { margin: 1.5em 0; border: 0; border-top: 1px solid var(--line); }
.md a { color: var(--accent); text-decoration: none; }
.md a:hover { text-decoration: underline; }
.md img { max-width: 100%; border-radius: 8px; }
.md :not(pre) > code, .md .math { padding: .12em .35em; border-radius: 5px; background: var(--bg-3); font: .875em/1.5 var(--mono); overflow-wrap: anywhere; }
.md .math { background: none; color: var(--fg-2); padding: 0; }
.md .math-block { display: block; padding: 10px 14px; border-radius: 10px; background: var(--code-bg); color: var(--fg-2); font: 13px/1.6 var(--mono); white-space: pre-wrap; overflow-x: auto; }
.md .table-wrap { overflow-x: auto; }
.md table { border-collapse: collapse; font-size: 14px; }
.md th, .md td { padding: 6px 12px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
.md th { background: var(--bg-2); font-weight: 600; }
.code { border: 1px solid var(--line); border-radius: 10px; background: var(--code-bg); overflow: hidden; }
.code-head { display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 6px 0 12px; border-bottom: 1px solid var(--line); font: 12px var(--mono); color: var(--fg-3); }
.code-head button { height: 24px; padding: 0 8px; border-radius: 6px; font: 12px var(--font); color: var(--fg-2); }
.code-head button:hover { background: var(--hover); color: var(--fg); }
.code pre { margin: 0; padding: 12px 14px; overflow-x: auto; font: 13px/1.6 var(--mono); tab-size: 4; }
.hl-k { color: var(--hl-k); } .hl-s { color: var(--hl-s); } .hl-c { color: var(--hl-c); font-style: italic; } .hl-n { color: var(--hl-n); } .hl-f { color: var(--hl-f); }

/* Composer */
footer { position: relative; flex: none; padding: 0 16px calc(12px + env(safe-area-inset-bottom)); }
.composer { max-width: 800px; margin: 0 auto; padding: 6px; border: 1px solid var(--line); border-radius: 22px; background: var(--bg); box-shadow: 0 2px 12px rgba(0,0,0,.05); }
.composer:focus-within { border-color: var(--fg-3); }
.composer.drag { border-color: var(--accent); border-style: dashed; }
#thumbs { display: flex; flex-wrap: wrap; gap: 10px; padding: 8px 8px 4px; }
.thumb { position: relative; }
.thumb img { display: block; width: 56px; height: 56px; object-fit: cover; border-radius: 10px; }
.thumb button { position: absolute; top: -6px; right: -6px; display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: var(--fg); color: var(--bg); }
.thumb button svg.i { width: 12px; height: 12px; stroke-width: 3; }
.composer-row { display: flex; align-items: flex-end; gap: 4px; }
#input { flex: 1; min-width: 0; max-height: 40vh; padding: 7px 6px; border: 0; outline: none; resize: none; background: transparent; line-height: 1.5; }
#send { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; flex: none; border-radius: 50%; background: var(--fg); color: var(--bg); }

/* Dialogs & forms */
dialog { width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 32px); padding: 0; border: 0; border-radius: 16px; background: var(--bg); color: var(--fg); box-shadow: var(--shadow); }
dialog[open] { display: flex; flex-direction: column; }
dialog::backdrop { background: rgba(0,0,0,.4); }
.dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 6px 20px; }
.dlg-head h3 { margin: 0; font-size: 17px; font-weight: 600; }
.dlg-body { flex: 1; padding: 8px 20px 16px; overflow-y: auto; }
.dlg-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid var(--line); }
.spacer { flex: 1; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; font-size: 13px; color: var(--fg-2); }
.field > span:first-child { font-weight: 500; }
.field input:not([type="checkbox"]), .field select, .field textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); font-size: 14px; outline: none; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { resize: vertical; line-height: 1.5; }
.field .mono, .mono { font-family: var(--mono); font-size: 13px; }
.secret:not(:focus) { -webkit-text-security: disc; }
.field.check { flex-direction: row; align-items: center; gap: 8px; margin-top: 26px; color: var(--fg); }
.field.check input { width: 16px; height: 16px; margin: 0; }
.field-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.hint { margin: 0; font-size: 12px; color: var(--fg-3); overflow-wrap: anywhere; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 14px; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { border-color: var(--fg); background: var(--fg); color: var(--bg); }
.btn.primary:hover { opacity: .88; }
.btn.danger { color: var(--danger); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
section + section { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
section h4 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
.sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.sec-head h4 { margin: 0; }
.prov { display: flex; align-items: center; gap: 10px; width: 100%; margin-bottom: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; text-align: left; }
.prov:hover { background: var(--hover); }
.prov > div { flex: 1; min-width: 0; }
.prov .p-name { font-weight: 500; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.prov .p-sub { font-size: 12px; color: var(--fg-3); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.picker { margin-top: 6px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.field .picker input[type="search"] { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; }
.picker-list { max-height: 220px; overflow-y: auto; padding: 4px 0; }
.picker-list label { display: flex; align-items: center; gap: 8px; padding: 4px 10px; color: var(--fg); font: 13px var(--mono); cursor: pointer; overflow-wrap: anywhere; }
.picker-list label:hover { background: var(--hover); }
details.adv > summary { margin-bottom: 12px; font-size: 13px; color: var(--fg-2); cursor: pointer; }
#dlg-img { width: auto; max-width: calc(100vw - 24px); background: transparent; box-shadow: none; }
#dlg-img img { display: block; max-width: 100%; max-height: calc(100dvh - 48px); border-radius: 10px; cursor: zoom-out; }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 100; max-width: calc(100vw - 32px); padding: 8px 16px; border-radius: 20px; background: var(--fg); color: var(--bg); font-size: 14px; box-shadow: var(--shadow); opacity: 0; transform: translateX(-50%); transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }

@media (min-width: 769px) {
  body:not(.side-hidden) #btn-new2 { display: none; }
}
@media (max-width: 768px) {
  #side { position: fixed; z-index: 30; top: 0; bottom: 0; left: 0; width: min(300px, 85vw); margin-left: 0 !important; transform: translateX(-102%); }
  body.side-open #side { transform: none; box-shadow: var(--shadow); }
  body.side-open #overlay { display: block; position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.35); }
  #msgs { padding: 4px 14px 20px; }
  footer { padding: 0 10px calc(8px + env(safe-area-inset-bottom)); }
  /* iOS zooms into any focused field under 16px */
  input, select, textarea, .field input:not([type="checkbox"]), .field select, .field textarea,
  .side-search input, #model-select, .field .mono { font-size: 16px; }
}
@media (hover: none) {
  /* Touch: show actions for the latest exchange, or for a message after tapping it. */
  .msg-actions { display: none; }
  .msg:last-child .msg-actions, .msg:nth-last-child(2) .msg-actions, .msg.tapped .msg-actions { display: flex; opacity: 1; }
}
</style>
</head>

function toNum(v, integer) {
  if (v === '' || v == null) return null;
  const n = integer ? parseInt(v, 10) : parseFloat(v);
  return Number.isFinite(n) && (!integer || n > 0) ? n : null;
}

// Parses an optional JSON-object text field (extra headers / body). Throws a readable error.
function parseObj(text, label) {
  if (!text || !text.trim()) return {};
  let v = null;
  try { v = JSON.parse(text); } catch (e) { /* handled below */ }
  if (!v || typeof v !== 'object' || Array.isArray(v)) throw new Error(t('invalidJson', label));
  return v;
}

let toastTimer = 0;
function toast(text, ms = 2400) {
  const el = $('#toast');
  // Dialogs live in the top layer, so the toast has to move into the open one to stay visible.
  const host = [...document.querySelectorAll('dialog[open]')].pop() || document.body;
  if (el.parentNode !== host) host.append(el);
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    // Fallback for insecure contexts (plain http) where the Clipboard API is unavailable.
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.append(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { /* ignore */ }
    ta.remove();
    return ok;
  }
}

// ---------- Storage: IndexedDB, falling back to localStorage, then memory ----------
const store = (() => {
  const PREFIX = 'justchat:';
  const mem = { kv: new Map(), chats: new Map() };
  let db = null;
  let mode = 'idb';

  const openDB = () => new Promise((resolve, reject) => {
    const req = indexedDB.open('justchat', 1);
    req.onupgradeneeded = () => {
      req.result.createObjectStore('kv');
      req.result.createObjectStore('chats', { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
    req.onblocked = () => reject(new Error('IndexedDB blocked'));
  });
  // The value is cloned synchronously when put() is called, so later mutations don't leak in.
  const run = (name, write, fn) => new Promise((resolve, reject) => {
    const tx = db.transaction(name, write ? 'readwrite' : 'readonly');
    const req = fn(tx.objectStore(name));
    tx.oncomplete = () => resolve(req && req.result);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
  });
  const ls = {
    get: k => JSON.parse(localStorage.getItem(PREFIX + k) || 'null'),
    set: (k, v) => localStorage.setItem(PREFIX + k, JSON.stringify(v)),
    keys: p => Object.keys(localStorage).filter(k => k.startsWith(PREFIX + p)).map(k => k.slice(PREFIX.length)),
  };

  return {
    get mode() { return mode; },
    async init() {
      try { db = await openDB(); return; } catch (e) { console.warn('IndexedDB unavailable:', e); }
      try {
        localStorage.setItem(PREFIX + 'probe', '1');
        localStorage.removeItem(PREFIX + 'probe');
        mode = 'local';
      } catch (e) { mode = 'memory'; }
    },
    async get(key) {
      if (mode === 'idb') return run('kv', false, s => s.get(key));
      if (mode === 'local') return ls.get('kv:' + key);
      return mem.kv.get(key);
    },
    async set(key, value) {
      if (mode === 'idb') return run('kv', true, s => s.put(value, key));
      if (mode === 'local') return ls.set('kv:' + key, value);
      mem.kv.set(key, JSON.parse(JSON.stringify(value)));
    },
    async allChats() {
      if (mode === 'idb') return run('chats', false, s => s.getAll());
      if (mode === 'local') return ls.keys('chat:').map(ls.get).filter(Boolean);
      return [...mem.chats.values()].map(c => JSON.parse(JSON.stringify(c)));
    },
    async putChat(chat) {
      if (mode === 'idb') return run('chats', true, s => s.put(chat));
      if (mode === 'local') return ls.set('chat:' + chat.id, chat);
      mem.chats.set(chat.id, JSON.parse(JSON.stringify(chat)));
    },
    async deleteChat(id) {
      if (mode === 'idb') return run('chats', true, s => s.delete(id));
      if (mode === 'local') return localStorage.removeItem(PREFIX + 'chat:' + id);
      mem.chats.delete(id);
    },
    async clear() {
      if (mode === 'idb') {
        await run('kv', true, s => s.clear());
        await run('chats', true, s => s.clear());
      } else if (mode === 'local') {
        ls.keys('').forEach(k => localStorage.removeItem(PREFIX + k));
      } else {
        mem.kv.clear();
        mem.chats.clear();
      }
    },
  };
})();
