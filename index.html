function normalizeSettings(s) {
  s = s && typeof s === 'object' ? s : {};
  return {
    providers: Array.isArray(s.providers) ? s.providers.filter(p => p && typeof p === 'object').map(normalizeProvider) : [],
    defaults: { ...DEFAULT_OPTIONS, ...s.defaults },
    theme: ['light', 'dark'].includes(s.theme) ? s.theme : 'system',
    lang: ['en', 'zh'].includes(s.lang) ? s.lang : 'auto',
    sendKey: s.sendKey === 'mod-enter' ? 'mod-enter' : 'enter',
  };
}

function normalizeProvider(p) {
  return {
    id: String(p.id || uid()),
    name: String(p.name || ''),
    type: p.type === 'anthropic' ? 'anthropic' : 'openai',
    baseUrl: String(p.baseUrl || ''),
    apiKey: String(p.apiKey || ''),
    models: Array.isArray(p.models) ? [...new Set(p.models.map(String).filter(Boolean))] : [],
    headers: String(p.headers || ''),
    body: String(p.body || ''),
  };
}

function normalizeChat(c) {
  c.id = String(c.id);
  c.title = typeof c.title === 'string' ? c.title : '';
  c.created = c.created || Date.now();
  c.updated = c.updated || c.created;
  c.options = { ...DEFAULT_OPTIONS, ...settings.defaults, ...c.options };
  c.messages = Array.isArray(c.messages) ? c.messages.filter(m => m && (m.role === 'user' || m.role === 'assistant')) : [];
  for (const m of c.messages) {
    m.id = m.id ? String(m.id) : uid();
    m.content = typeof m.content === 'string' ? m.content : '';
    if (m.partial) { delete m.partial; m.stopped = true; } // interrupted by a page reload
  }
  delete c.draft;
  return c;
}

function makeChat() {
  const now = Date.now();
  return { id: uid(), title: '', created: now, updated: now, options: { ...settings.defaults }, messages: [], draft: true };
}

function saveSettings() {
  return store.set('settings', settings).catch(e => toast(t('storageError', e.message || e), 5000));
}

function saveChat(chat) {
  if (chat.draft) return Promise.resolve();
  return store.putChat(chat).catch(e => toast(t('storageError', e.message || e), 5000));
}

// ---------- Syntax highlighting (small, regex based) ----------
const highlight = (() => {
  const KW = new Set(('abstract and as assert async await break case catch class const constexpr continue def default defer del delete do elif else enum except export extends extern false final finally fn for foreach from func function go goto if impl implements import in include instanceof interface is lambda let loop match mod module mut namespace new nil none nonlocal not null of or override package pass private protected pub public raise readonly record return self Self sealed static struct super switch synchronized this throw throws trait true try type typedef typeof undefined union unless unsafe use using val var virtual void volatile when where while with yield None True False ' +
    'int float double char bool boolean string long short byte unsigned signed auto str usize isize u8 u16 u32 u64 i8 i16 i32 i64 f32 f64 ' +
    'then fi esac done echo local').split(' '));
  const SQL = new Set('select from where insert into update delete create table drop alter add join left right inner outer full cross on group by order having limit offset values set and or not null is as distinct union all case when then else end exists in like between primary key foreign references index view begin commit rollback returning with default if'.split(' '));
  const P = {
    slash: String.raw`\/\/[^\n]*|\/\*[\s\S]*?\*\/`,
    hash: String.raw`#[^\n]*`,
    dash: String.raw`--[^\n]*|\/\*[\s\S]*?\*\/`,
    lua: String.raw`--\[\[[\s\S]*?\]\]|--[^\n]*`,
    xml: String.raw`<!--[\s\S]*?-->`,
    dq: String.raw`"(?:\\[\s\S]|[^"\\\n])*"`,
    sq: String.raw`'(?:\\[\s\S]|[^'\\\n])*'`,
    bt: String.raw`\x60(?:\\[\s\S]|[^\x60\\])*\x60`,
    tq: String.raw`"""[\s\S]*?"""|'''[\s\S]*?'''`,
    tag: String.raw`<\/?[A-Za-z][\w:.-]*|\/?>`,
    none: String.raw`(?!)`,
  };
  const MODES = {
    c: [P.slash, [P.dq, P.sq, P.bt], P.none],
    rust: [P.slash, [P.dq], P.none],
    py: [P.hash, [P.tq, P.dq, P.sq], P.none],
    sh: [P.hash, [P.dq, P.sq], P.none],
    sql: [P.dash, [P.sq, P.dq], P.none],
    lua: [P.lua, [P.dq, P.sq], P.none],
    html: [P.xml, [P.dq, P.sq], P.tag],
  };
  const RE = {};
  for (const [mode, [comment, strings, extra]] of Object.entries(MODES)) {
    // Groups: 1 comment, 2 string, 3 number, 4 tag, 5 identifier before "(", 6 identifier
    RE[mode] = new RegExp(`(${comment})|(${strings.join('|')})|(\\b(?:0[xX][\\da-fA-F_]+|\\d[\\d_]*(?:\\.\\d+)?(?:[eE][+-]?\\d+)?)\\b)|(${extra})|([A-Za-z_$][\\w$]*)(?=\\s*\\()|([A-Za-z_$][\\w$]*)`, 'g');
  }
  const LANGS = {};
  const alias = (mode, names) => names.split(' ').forEach(n => { LANGS[n] = mode; });
  alias('c', 'js javascript mjs cjs jsx ts typescript tsx java c h cpp cc cxx hpp c++ cs csharp go golang swift kotlin kt kts scala dart php json jsonc json5 css scss less groovy gradle objc objectivec zig solidity sol proto protobuf glsl hlsl wgsl v');
  alias('rust', 'rust rs');
  alias('py', 'python py python3 ruby rb perl pl r elixir ex exs nim julia jl');
  alias('sh', 'sh bash shell zsh fish console shellscript powershell ps1 dockerfile docker makefile make cmake yaml yml toml ini conf properties env nginx');
  alias('sql', 'sql mysql postgresql postgres psql sqlite plsql tsql');
  alias('lua', 'lua haskell hs');
  alias('html', 'html htm xml svg vue xhtml');
  const escText = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  return function highlight(code, lang) {
    const mode = LANGS[String(lang || '').toLowerCase()];
    if (!mode || code.length > 200000) return escText(code);
    const re = RE[mode];
    const isKw = mode === 'sql' ? w => SQL.has(w.toLowerCase()) : w => KW.has(w);
    let out = '';
    let last = 0;
    let m;
    re.lastIndex = 0;
    while ((m = re.exec(code))) {
      if (!m[0]) { re.lastIndex++; continue; }
      const cls = m[1] ? 'c' : m[2] ? 's' : m[3] ? 'n' : m[4] ? 'k' : m[5] ? (isKw(m[5]) ? 'k' : 'f') : isKw(m[6]) ? 'k' : '';
      out += escText(code.slice(last, m.index)) + (cls ? `<span class="hl-${cls}">${escText(m[0])}</span>` : escText(m[0]));
      last = re.lastIndex;
    }
    return out + escText(code.slice(last));
  };
})();

// ---------- Markdown (GFM subset; output is always escaped, raw HTML is never passed through) ----------
const md = (() => {
  const escText = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const escAttr = s => escText(s).replace(/"/g, '&quot;');
  const LIST = /^( *)([-*+]|\d{1,9}[.)])(?:([ \t]+)(.*))?$/;
  const HR = /^ {0,3}([-*_])(?:[ \t]*\1){2,}[ \t]*$/;
  const indentOf = line => line.match(/^ */)[0].length;
  const dedent = (line, n) => line.replace(new RegExp(`^ {0,${n}}`), '');

  function fenceStart(line) {
    const m = /^( *)(`{3,}|~{3,})(.*)$/.exec(line);
    if (!m || (m[2][0] === '`' && m[3].includes('`'))) return null;
    return { indent: m[1].length, fence: m[2], lang: m[3].trim().split(/\s+/)[0].replace(/^\{\.?|\}$/g, '') };
  }
  function isFenceEnd(line, fence) {
    const m = /^ *(`{3,}|~{3,})[ \t]*$/.exec(line);
    return !!m && m[1][0] === fence[0] && m[1].length >= fence.length;
  }
  function splitRow(line) {
    let s = line.trim();
    if (s.startsWith('|')) s = s.slice(1);
    if (s.endsWith('|') && !s.endsWith('\\|')) s = s.slice(0, -1);
    const cells = [];
    let cur = '';
    for (let i = 0; i < s.length; i++) {
      if (s[i] === '\\' && s[i + 1] === '|') { cur += '|'; i++; } else if (s[i] === '|') { cells.push(cur.trim()); cur = ''; } else cur += s[i];
    }
    cells.push(cur.trim());
    return cells;
  }
  const isTableSep = line => /^ *\|? *:?-+:? *(\| *:?-+:? *)*\|? *$/.test(line);
  const isTableStart = (lines, i) => lines[i].includes('|') && i + 1 < lines.length && isTableSep(lines[i + 1]) &&
    splitRow(lines[i]).length === splitRow(lines[i + 1]).length;
  // Whether a line ends the paragraph above it. As in CommonMark, only an ordered list starting at 1
  // interrupts a paragraph, so a line like "2024. was a good year" stays text.
  const startsBlock = line => {
    if (fenceStart(line) || /^ {0,3}(#{1,6}([ \t]|$)|>|\$\$|\\\[)/.test(line) || HR.test(line)) return true;
    const m = LIST.exec(line);
    return !!m && (!/\d/.test(m[2]) || parseInt(m[2], 10) === 1);
  };

  function codeBlock(code, lang) {
    return `<div class="code"><div class="code-head"><span>${escText(lang || 'text')}</span>` +
      `<button type="button" class="code-copy">${escText(t('copy'))}</button></div>` +
      `<pre><code>${highlight(code, lang)}</code></pre></div>`;
  }

  function list(lines, i) {
    const first = LIST.exec(lines[i]);
    const base = first[1].length;
    const ordered = /\d/.test(first[2]);
    const items = [];
    let loose = false;
    while (i < lines.length) {
      const line = lines[i];
      const m = LIST.exec(line);
      if (m && m[1].length < base + 2 && !HR.test(line)) {
        if (m[1].length < base || /\d/.test(m[2]) !== ordered) break;
        const gap = m[3] ? Math.min(m[3].length, 4) : 1;
        items.push({ lines: [m[4] || ''], width: m[1].length + m[2].length + gap });
        i++;
        continue;
      }
      const item = items[items.length - 1];
      if (!line.trim()) {
        let j = i + 1;
        while (j < lines.length && !lines[j].trim()) j++;
        if (j >= lines.length) break;
        const next = LIST.exec(lines[j]);
        if (indentOf(lines[j]) >= base + 2) { item.lines.push(''); i++; continue; }
        if (next && next[1].length >= base && /\d/.test(next[2]) === ordered && !HR.test(lines[j])) { loose = true; i = j; continue; }
        break;
      }
      if (indentOf(line) >= base + 2) { item.lines.push(line); i++; continue; }
      // Lazy continuation of the item's paragraph.
      if (item.lines[item.lines.length - 1].trim() && !startsBlock(line) && !isTableStart(lines, i)) { item.lines.push(line); i++; continue; }
      break;
    }
    const tag = ordered ? 'ol' : 'ul';
    const start = ordered ? parseInt(first[2], 10) : 1;
    let html = `<${tag}${start !== 1 ? ` start="${start}"` : ''}>`;
    for (const item of items) {
      const content = [item.lines[0], ...item.lines.slice(1).map(l => dedent(l, item.width))];
      const task = /^\[([ xX])\](?:[ \t]+|$)/.exec(content[0]);
      if (task) content[0] = content[0].slice(task[0].length);
      let inner = blocks(content);
      if (!loose) inner = inner.replace(/^<p>([\s\S]*?)<\/p>/, '$1');
      html += task
        ? `<li class="task"><input type="checkbox" disabled${task[1] === ' ' ? '' : ' checked'}> ${inner}</li>`
        : `<li>${inner}</li>`;
    }
    return [html + `</${tag}>`, i];
  }

  function table(lines, i) {
    const head = splitRow(lines[i]);
    const align = splitRow(lines[i + 1]).map(c => /^:-+:$/.test(c) ? 'center' : /-:$/.test(c) ? 'right' : /^:/.test(c) ? 'left' : '');
    const cell = (tag, text, k) => `<${tag}${align[k] ? ` style="text-align:${align[k]}"` : ''}>${inline(text || '')}</${tag}>`;
    let html = `<div class="table-wrap"><table><thead><tr>${head.map((c, k) => cell('th', c, k)).join('')}</tr></thead><tbody>`;
    for (i += 2; i < lines.length && lines[i].trim() && lines[i].includes('|'); i++) {
      const row = splitRow(lines[i]);
      html += `<tr>${head.map((_, k) => cell('td', row[k], k)).join('')}</tr>`;
    }
    return [html + '</tbody></table></div>', i];
  }

  function blocks(lines) {
    let html = '';
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (!line.trim()) { i++; continue; }
      let m;
      const fence = fenceStart(line);
      if (fence) {
        const body = [];
        for (i++; i < lines.length && !isFenceEnd(lines[i], fence.fence); i++) body.push(dedent(lines[i], fence.indent));
        i++;
        html += codeBlock(body.join('\n'), fence.lang);
        continue;
      }
      if ((m = /^ {0,3}(\$\$|\\\[)(.*)$/.exec(line))) {
        // Display math: shown as TeX source, protected from markdown processing.
        const close = m[1] === '$$' ? '$$' : '\\]';
        const parts = [];
        let end = -1;
        let j = i;
        let rest = m[2];
        for (;;) {
          const k = rest.indexOf(close);
          if (k >= 0) {
            if (!rest.slice(k + close.length).trim()) { parts.push(rest.slice(0, k)); end = j; }
            break;
          }
          parts.push(rest);
          if (++j >= lines.length) { end = lines.length - 1; break; } // unclosed (still streaming)
          rest = lines[j];
        }
        if (end >= 0) {
          html += `<div class="math-block">${escText(parts.join('\n').trim())}</div>`;
          i = end + 1;
          continue;
        }
      }
      if ((m = /^ {0,3}(#{1,6})(?:[ \t]+(.*?))?(?:[ \t]+#+)?[ \t]*$/.exec(line))) {
        const n = m[1].length;
        html += `<h${n}>${inline(m[2] || '')}</h${n}>`;
        i++;
        continue;
      }
      if (HR.test(line)) { html += '<hr>'; i++; continue; }
      if (/^ {0,3}>/.test(line)) {
        const quote = [];
        while (i < lines.length && (/^ {0,3}>/.test(lines[i]) ||
          (lines[i].trim() && quote.length && quote[quote.length - 1].trim() && !startsBlock(lines[i])))) {
          quote.push(lines[i].replace(/^ {0,3}> ?/, ''));
          i++;
        }
        html += `<blockquote>${blocks(quote)}</blockquote>`;
        continue;
      }
      if (LIST.test(line)) {
        const [out, next] = list(lines, i);
        html += out;
        i = next;
        continue;
      }
      if (isTableStart(lines, i)) {
        const [out, next] = table(lines, i);
        html += out;
        i = next;
        continue;
      }
      const para = [line.trim()];
      for (i++; i < lines.length && lines[i].trim() && !startsBlock(lines[i]) && !isTableStart(lines, i); i++) para.push(lines[i].trim());
      html += `<p>${inline(para.join('\n'))}</p>`;
    }
    return html;
  }

  function safeUrl(url, image) {
    const u = url.replace(/[\u0000- \u007f]/g, '');
    const scheme = /^([a-z][a-z0-9+.-]*):/i.exec(u);
    if (!scheme) return u;
    const s = scheme[1].toLowerCase();
    if (s === 'http' || s === 'https') return u;
    if (!image && (s === 'mailto' || s === 'tel')) return u;
    if (image && /^data:image\/(png|jpe?g|gif|webp|avif|bmp);base64,/i.test(u)) return u;
    return '';
  }
  const link = (href, html) => `<a href="${escAttr(href)}" target="_blank" rel="noopener noreferrer">${html}</a>`;
  const ENTITIES = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", nbsp: '\u00a0' };

  function emphasis(s) {
    return s
      .replace(/\*\*\*(?=\S)([\s\S]*?\S)\*\*\*/g, '<strong><em>$1</em></strong>')
      .replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^\p{L}\p{N}_])__(?=\S)([\s\S]*?\S)__(?![\p{L}\p{N}_])/gu, '$1<strong>$2</strong>')
      .replace(/(^|[^*])\*(?=[^\s*])([^\n*]*?[^\s*])\*(?!\*)/g, '$1<em>$2</em>')
      .replace(/(^|[^\p{L}\p{N}_])_(?=[^\s_])([^\n_]*?[^\s_])_(?![\p{L}\p{N}_])/gu, '$1<em>$2</em>')
      .replace(/~~(?=\S)([\s\S]*?\S)~~/g, '<del>$1</del>');
  }

  // Code, math, escapes and links are swapped for placeholders so later rules can't touch them. Each placeholder
  // keeps its HTML and its plain text; attributes (href, src, alt) only ever get the escaped plain text.
  function inline(text) {
    const held = [];
    const hold = (html, plain) => `\uE000${held.push({ html, plain }) - 1}\uE001`;
    const plain = str => str.replace(/\uE000(\d+)\uE001/g, (_, k) => (held[k] ? plain(held[k].plain) : ''));
    const math = (tex, display) => hold(`<span class="math${display ? ' math-block' : ''}">${escText(tex.trim())}</span>`, tex.trim());
    let s = text
      .replace(/(`+)([\s\S]*?[^`])\1(?!`)/g, (_, tick, code) => {
        code = code.replace(/\n/g, ' ');
        if (/^ .*[^ ].* $/.test(code)) code = code.slice(1, -1);
        return hold(`<code>${escText(code)}</code>`, code);
      })
      .replace(/\\\$/g, () => hold('$', '$'))
      .replace(/\$\$([\s\S]+?)\$\$/g, (_, tex) => math(tex, true))
      .replace(/\\\[([\s\S]+?)\\\]/g, (_, tex) => math(tex, true))
      .replace(/\\\(([\s\S]+?)\\\)/g, (_, tex) => math(tex))
      .replace(/\$(?![\s$])((?:[^$\n\\]|\\.)*?[^\s$\\])\$(?![\w$])/g, (_, tex) => math(tex))
      .replace(/\\([!-/:-@[-`{-~])/g, (_, c) => hold(escText(c), c))
      .replace(/<(https?:\/\/[^\s<>]+)>/g, (all, url) => {
        const href = safeUrl(plain(url));
        return href ? hold(link(href, escText(plain(url))), url) : all;
      })
      .replace(/!\[([^\]\n]*)\]\(\s*<?([^\s()<>]*(?:\([^\s()]*\)[^\s()<>]*)*)>?(?:\s+(?:"[^"\n]*"|'[^'\n]*'))?\s*\)/g, (all, alt, url) => {
        const src = safeUrl(plain(url), true);
        const text = plain(alt);
        return src ? hold(`<img src="${escAttr(src)}" alt="${escAttr(text)}" loading="lazy">`, text) : hold(escText(text), text);
      })
      .replace(/\[((?:[^[\]\n]|\[[^[\]\n]*\])*)\]\(\s*<?([^\s()<>]*(?:\([^\s()]*\)[^\s()<>]*)*)>?(?:\s+(?:"[^"\n]*"|'[^'\n]*'))?\s*\)/g, (all, label, url) => {
        const href = safeUrl(plain(url));
        const html = emphasis(escText(label));
        return hold(href ? link(href, html) : html, label);
      })
      .replace(/\bhttps?:\/\/[\w\-.~:/?#[\]@!$&'()*+,;=%]+/g, url => {
        let tail = '';
        while (/[.,;:!?'")\]]$/.test(url)) {
          if (url.endsWith(')') && url.split('(').length >= url.split(')').length) break;
          tail = url.slice(-1) + tail;
          url = url.slice(0, -1);
        }
        return hold(link(url, escText(url)), url) + tail;
      })
      .replace(/&(#\d{1,7}|#x[\da-f]{1,6}|amp|lt|gt|quot|apos|nbsp);/gi, (all, name) => {
        const n = name[0] !== '#' ? -1 : name[1] === 'x' || name[1] === 'X' ? parseInt(name.slice(2), 16) : parseInt(name.slice(1), 10);
        const ch = n < 0 ? ENTITIES[name.toLowerCase()] : n > 0 && n <= 0x10ffff && (n < 0xd800 || n > 0xdfff) ? String.fromCodePoint(n) : '';
        return ch ? hold(escText(ch), ch) : all;
      });
    s = escText(s)
      .replace(/&lt;br\s*\/?&gt;/gi, '<br>')
      .replace(/&lt;(sup|sub|kbd|mark|ins|del|small|u|s|b|i|em|strong)&gt;([\s\S]*?)&lt;\/\1&gt;/gi, '<$1>$2</$1>');
    s = emphasis(s).replace(/\n/g, '<br>');
    for (let n = 0; n < 8 && s.includes('\uE000'); n++) s = s.replace(/\uE000(\d+)\uE001/g, (_, k) => (held[k] ? held[k].html : ''));
    return s;
  }

  return function render(src) {
    const lines = String(src || '').replace(/\r\n?/g, '\n').split('\n');
    // Expand leading tabs outside fenced code so indentation math works; code keeps its tabs.
    let fence = null;
    for (let i = 0; i < lines.length; i++) {
      if (fence) {
        if (isFenceEnd(lines[i], fence)) fence = null;
        continue;
      }
      lines[i] = lines[i].replace(/^[ \t]+/, w => w.replace(/\t/g, '    '));
      const f = fenceStart(lines[i]);
      if (f) fence = f.fence;
    }
    return blocks(lines);
  };
})();

// Splits leading <think>…</think> (used by some reasoning models) into reasoning and answer.
function splitThink(text) {
  const m = /^\s*<(think|thinking)>([\s\S]*?)(?:<\/\1>\s*|$)/.exec(text);
  if (m) return { reasoning: m[2].trim(), content: text.slice(m[0].length) };
  const k = text.indexOf('</think>');
  if (k > 0 && !text.includes('<think>')) return { reasoning: text.slice(0, k).trim(), content: text.slice(k + 8).replace(/^\s+/, '') };
  return null;
}

// ---------- API ----------
const DEFAULT_BASE = { openai: 'https://api.openai.com/v1', anthropic: 'https://api.anthropic.com' };
const ANTHROPIC_DEFAULT_MAX_TOKENS = 8192; // the Messages API requires max_tokens

// OpenAI-style base URLs include the version (".../v1"); Anthropic-style ones don't.
// A full endpoint URL pasted by the user is accepted too.
function apiURL(p, kind) {
  const raw = (p.baseUrl || DEFAULT_BASE[p.type]).trim();
  const q = raw.indexOf('?');
  let base = (q < 0 ? raw : raw.slice(0, q)).replace(/\/+$/, '');
  let query = q < 0 ? '' : raw.slice(q + 1); // kept, e.g. "?api-version=..."
  let path;
  if (p.type === 'anthropic') {
    base = base.replace(/\/messages$/, '');
    if (!/\/v\d+$/.test(base)) base += '/v1';
    path = kind === 'models' ? '/models' : '/messages';
    if (kind === 'models') query = query ? query + '&limit=1000' : 'limit=1000';
  } else {
    base = base.replace(/\/chat\/completions$/, '');
    if (/^https?:\/\/[^/]+$/i.test(base)) base += '/v1';
    path = kind === 'models' ? '/models' : '/chat/completions';
  }
  return base + path + (query ? '?' + query : '');
}

function apiHeaders(p, json) {
  const h = json ? { 'Content-Type': 'application/json' } : {};
  if (p.type === 'anthropic') {
    h['anthropic-version'] = '2023-06-01';
    h['anthropic-dangerous-direct-browser-access'] = 'true';
    if (p.apiKey) h['x-api-key'] = p.apiKey;
  } else if (p.apiKey) {
    h.Authorization = 'Bearer ' + p.apiKey;
  }
  return Object.assign(h, parseObj(p.headers, t('extraHeaders')));
}

// Messages sent as context: non-empty, starting and ending with a user turn, roles alternating.
function contextMessages(chat) {
  let list = chat.messages.map(m => ({
    role: m.role,
    content: m.role === 'assistant' ? (splitThink(m.content) || m).content.trim() : m.content,
    images: m.role === 'user' && m.images && m.images.length ? m.images : null,
  })).filter(m => m.content.trim() || m.images);
  const limit = chat.options.context;
  if (limit > 0) list = list.slice(-limit);
  while (list.length && list[0].role !== 'user') list.shift();
  while (list.length && list[list.length - 1].role !== 'user') list.pop();
  // Merge same-role neighbours (e.g. two user turns around a failed reply); strict chat templates require alternation.
  const merged = [];
  for (const m of list) {
    const prev = merged[merged.length - 1];
    if (prev && prev.role === m.role) {
      prev.content = [prev.content, m.content].filter(Boolean).join('\n\n');
      if (m.images) prev.images = (prev.images || []).concat(m.images);
    } else {
      merged.push({ ...m });
    }
  }
  return merged;
}

function buildRequest(p, model, o, history) {
  const url = apiURL(p, 'chat');
  const body = { model };
  const system = (o.system || '').trim() ? o.system : '';
  if (p.type === 'anthropic') {
    body.max_tokens = o.maxTokens || ANTHROPIC_DEFAULT_MAX_TOKENS;
    if (system) body.system = system;
    body.messages = history.map(m => ({
      role: m.role,
      content: m.images
        ? [...m.images.map(anthropicImage), ...(m.content ? [{ type: 'text', text: m.content }] : [])]
        : m.content,
    }));
    if (o.reasoning) {
      body.thinking = { type: 'adaptive', display: 'summarized' };
      body.output_config = { effort: o.reasoning };
    }
  } else {
    body.messages = system ? [{ role: 'system', content: system }] : [];
    for (const m of history) {
      body.messages.push({
        role: m.role,
        content: m.images
          ? [...(m.content ? [{ type: 'text', text: m.content }] : []), ...m.images.map(src => ({ type: 'image_url', image_url: { url: src } }))]
          : m.content,
      });
    }
    // OpenAI's own API only accepts max_completion_tokens on newer models; most compatible servers use max_tokens.
    if (o.maxTokens) body[url.startsWith('https://api.openai.com/') ? 'max_completion_tokens' : 'max_tokens'] = o.maxTokens;
    if (o.reasoning) body.reasoning_effort = o.reasoning;
  }
  if (o.temperature != null) body.temperature = o.temperature;
  if (o.topP != null) body.top_p = o.topP;
  body.stream = o.stream !== false;
  Object.assign(body, parseObj(p.body, t('extraBody')));
  return { url, headers: apiHeaders(p, true), body };
}

function anthropicImage(src) {
  const m = /^data:([^;,]+);base64,(.*)$/.exec(src);
  return m
    ? { type: 'image', source: { type: 'base64', media_type: m[1], data: m[2] } }
    : { type: 'image', source: { type: 'url', url: src } };
}

function errText(e) {
  if (!e) return '';
  if (typeof e === 'string') return e;
  if (typeof e.message === 'string') return e.message;
  if (typeof e.msg === 'string') return e.msg;
  if (e.detail) return typeof e.detail === 'string' ? e.detail : JSON.stringify(e.detail);
  if (e.error) return errText(e.error);
  return JSON.stringify(e);
}

async function httpError(res) {
  let text = '';
  try { text = (await res.text()).trim(); } catch (e) { /* ignore */ }
  let detail = text;
  try { detail = errText(JSON.parse(text)) || text; } catch (e) {
    if (text.startsWith('<')) detail = text.replace(/<(script|style)[\s\S]*?<\/\1>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  }
  return `HTTP ${res.status}${detail ? ': ' + detail.slice(0, 800) : res.statusText ? ' ' + res.statusText : ''}`;
}

async function request(url, init) {
  try {
    return await fetch(url, init);
  } catch (e) {
    if (e.name === 'AbortError') throw e;
    let host = url;
    try { host = new URL(url).host; } catch (err) { /* keep the raw URL */ }
    throw new Error(t('networkError', host, e.message || e));
  }
}

// Server-sent events: yields each `data:` payload parsed as JSON, stops at [DONE].
async function* sse(res) {
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  try {
    for (;;) {
      const { value, done } = await reader.read();
      buf += decoder.decode(value || new Uint8Array(), { stream: !done });
      const lines = buf.split('\n');
      buf = done ? '' : lines.pop();
      for (const raw of lines) {
        const line = raw.replace(/\r$/, '');
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') return;
        if (!data) continue;
        let json;
        try { json = JSON.parse(data); } catch (e) { continue; }
        yield json;
      }
      if (done) return;
    }
  } finally {
    reader.cancel().catch(() => {});
  }
}

function applyOpenAI(msg, d) {
  if (d.error) throw new Error(errText(d.error));
  const c = d.choices && d.choices[0];
  if (c) {
    const x = c.delta || c.message || {};
    const r = x.reasoning_content || x.reasoning; // DeepSeek / vLLM / OpenRouter style reasoning
    if (typeof r === 'string') msg.reasoning = (msg.reasoning || '') + r;
    if (typeof x.content === 'string') msg.content += x.content;
    else if (Array.isArray(x.content)) for (const part of x.content) if (part && typeof part.text === 'string') msg.content += part.text;
    if (c.finish_reason) msg.finish = c.finish_reason;
  }
  if (d.usage) msg.usage = { input: d.usage.prompt_tokens ?? d.usage.input_tokens ?? 0, output: d.usage.completion_tokens ?? d.usage.output_tokens ?? 0 };
}

function applyAnthropic(msg, d) {
  const block = b => {
    if (!b) return;
    if (b.type === 'text') msg.content += b.text || '';
    else if (b.type === 'thinking') msg.reasoning = (msg.reasoning ? msg.reasoning + '\n\n' : '') + (b.thinking || '');
  };
  const usage = u => {
    if (!u) return;
    const input = (u.input_tokens || 0) + (u.cache_creation_input_tokens || 0) + (u.cache_read_input_tokens || 0);
    const prev = msg.usage || {};
    msg.usage = { input: input || prev.input || 0, output: u.output_tokens ?? prev.output ?? 0 };
  };
  switch (d.type) {
    case 'error': throw new Error(errText(d.error));
    case 'message': // non-streaming response
      (d.content || []).forEach(block);
      msg.finish = d.stop_reason;
      usage(d.usage);
      break;
    case 'message_start': usage(d.message && d.message.usage); break;
    case 'content_block_start': block(d.content_block); break;
    case 'content_block_delta': {
      const x = d.delta || {};
      if (x.type === 'text_delta') msg.content += x.text || '';
      else if (x.type === 'thinking_delta') msg.reasoning = (msg.reasoning || '') + (x.thinking || '');
      break;
    }
    case 'message_delta':
      if (d.delta && d.delta.stop_reason) msg.finish = d.delta.stop_reason;
      usage(d.usage);
      break;
  }
}

// Sends the chat to the model and fills `msg` as the response arrives.
async function complete({ provider, model }, options, history, msg, onUpdate, signal) {
  const req = buildRequest(provider, model, options, history);
  const res = await request(req.url, { method: 'POST', headers: req.headers, body: JSON.stringify(req.body), signal });
  if (!res.ok) throw new Error(await httpError(res));
  const apply = provider.type === 'anthropic' ? applyAnthropic : applyOpenAI;
  if (req.body.stream && res.body && !/json/i.test(res.headers.get('content-type') || '')) {
    for await (const data of sse(res)) {
      apply(msg, data);
      onUpdate();
    }
  } else {
    apply(msg, await res.json());
  }
}

async function fetchModels(p) {
  const res = await request(apiURL(p, 'models'), { headers: apiHeaders(p, false) });
  if (!res.ok) throw new Error(await httpError(res));
  const j = await res.json();
  const list = Array.isArray(j) ? j : j.data || j.models || [];
  return [...new Set(list.map(m => (typeof m === 'string' ? m : m && (m.id || m.name))).filter(Boolean).map(String))].sort();
}

// Downscales large images so requests stay within provider limits.
async function readImage(file) {
  const MAX_SIDE = 2048;
  const dataUrl = await new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(r.error);
    r.readAsDataURL(file);
  });
  const img = await new Promise((resolve, reject) => {
    const el = new Image();
    el.onload = () => resolve(el);
    el.onerror = reject;
    el.src = dataUrl;
  });
  const scale = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
  if (scale === 1 && file.size <= 3 * 1024 * 1024 && /^image\/(png|jpeg|webp|gif)$/.test(file.type)) return dataUrl;
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
  canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', 0.9);
}

// ---------- UI state ----------
const ui = {
  list: $('#chat-list'), search: $('#search'), model: $('#model-select'),
  scroller: $('#scroller'), msgs: $('#msgs'), input: $('#input'), send: $('#send'),
  thumbs: $('#thumbs'), composer: $('#composer'), toBottom: $('#to-bottom'), fileInput: $('#file-input'),
  dlgChat: $('#dlg-chat'), dlgSettings: $('#dlg-settings'), dlgProvider: $('#dlg-provider'), dlgImg: $('#dlg-img'),
};
const state = {
  chats: [],          // saved chats, most recent first
  current: null,      // the open chat (may be an unsaved draft)
  attachments: [],    // images waiting in the composer (data URLs)
  running: new Map(), // chat id -> { ctrl, msg } for in-flight requests
  editing: null,      // id of the message being edited
  stick: true,        // keep the view pinned to the bottom while streaming
  persistAsked: false,
};

const findMsg = (chat, id) => chat.messages.find(m => m.id === id);
const isLive = (chat, msg) => { const r = state.running.get(chat.id); return !!r && r.msg === msg; };
const sortChats = () => state.chats.sort((a, b) => b.updated - a.updated);
const closeSide = () => document.body.classList.remove('side-open');
const setTitle = chat => { document.title = chat.title ? `${chat.title} - JustChat` : 'JustChat'; };

function hostOf(p) {
  try { return new URL(apiURL(p, 'chat')).host; } catch (e) { return p.baseUrl || p.type; }
}
function resolveModel(chat) {
  const o = chat.options;
  const provider = settings.providers.find(p => p.id === o.providerId);
  return provider && o.model ? { provider, model: o.model } : null;
}
function rememberChat(chat) {
  try { localStorage.setItem('justchat-last', chat.id); } catch (e) { /* ignore */ }
}

const darkQuery = matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const dark = settings.theme === 'dark' || (settings.theme === 'system' && darkQuery.matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  $('meta[name="theme-color"]').content = dark ? '#212121' : '#ffffff';
  try { localStorage.setItem('justchat-theme', settings.theme); } catch (e) { /* ignore */ }
}
darkQuery.addEventListener('change', () => { if (settings.theme === 'system') applyTheme(); });

function applyLang() {
  const lang = settings.lang === 'auto' ? (/^zh\b/i.test(navigator.language || '') ? 'zh' : 'en') : settings.lang;
  L = I18N[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  applyI18n();
}

// ---------- Rendering ----------
function renderAll() {
  renderChatList();
  renderModelSelect();
  renderMessages();
  updateComposer();
}

function renderChatList() {
  const q = ui.search.value.trim().toLowerCase();
  const chats = q
    ? state.chats.filter(c => c.title.toLowerCase().includes(q) || c.messages.some(m => m.content.toLowerCase().includes(q)))
    : state.chats;
  ui.list.innerHTML = chats.length ? chats.map(c =>
    `<div class="chat-item${c === state.current ? ' active' : ''}${state.running.has(c.id) ? ' running' : ''}" data-id="${esc(c.id)}">` +
    `<button class="t">${esc(c.title || t('untitled'))}</button>` +
    `<button class="icon-btn" data-act="rename" title="${esc(t('rename'))}" aria-label="${esc(t('rename'))}">${icon('edit')}</button>` +
    `<button class="icon-btn" data-act="delete" title="${esc(t('delete'))}" aria-label="${esc(t('delete'))}">${icon('trash')}</button></div>`
  ).join('') : `<div class="side-empty">${esc(t('noChats'))}</div>`;
}

function renderModelSelect() {
  const o = state.current.options;
  const sel = ui.model;
  sel.textContent = '';
  let found = false;
  for (const p of settings.providers) {
    const models = p.id === o.providerId && o.model && !p.models.includes(o.model) ? [o.model, ...p.models] : p.models;
    if (!models.length) continue;
    const group = document.createElement('optgroup');
    group.label = p.name || hostOf(p);
    for (const m of models) {
      const selected = p.id === o.providerId && m === o.model;
      found = found || selected;
      group.append(new Option(m, JSON.stringify([p.id, m]), selected, selected));
    }
    sel.append(group);
  }
  if (!found) {
    const placeholder = new Option(t('selectModel'), '', true, true);
    placeholder.disabled = true;
    sel.prepend(placeholder);
  }
  sel.append(new Option(t('manageProviders'), '__manage'));
  fitModelSelect();
}

// A <select> is as wide as its longest option; size it to the selected one instead.
function fitModelSelect() {
  const sel = ui.model;
  const option = sel.options[sel.selectedIndex];
  const ctx = fitModelSelect.ctx || (fitModelSelect.ctx = document.createElement('canvas').getContext('2d'));
  const cs = getComputedStyle(sel);
  ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  sel.style.width = Math.ceil(ctx.measureText(option ? option.text : '').width) + 44 + 'px';
}

function renderMessages() {
  const chat = state.current;
  if (!settings.providers.length) {
    ui.msgs.innerHTML = `<div class="empty"><h2>JustChat</h2><p>${esc(t('welcome'))}</p>` +
      `<button class="btn primary" data-act="add-provider">${esc(t('addProviderLong'))}</button></div>`;
    return;
  }
  if (!chat.messages.length) {
    ui.msgs.innerHTML = `<div class="empty"><h2>${esc(t('emptyChat'))}</h2><p>${esc(chat.options.model)}</p></div>`;
    return;
  }
  ui.msgs.textContent = '';
  for (const msg of chat.messages) ui.msgs.append(messageEl(chat, msg));
}

function messageEl(chat, msg) {
  const el = document.createElement('div');
  el.className = 'msg ' + msg.role;
  el.dataset.id = msg.id;
  if (state.editing === msg.id) {
    const user = msg.role === 'user';
    el.innerHTML = `<div class="bubble has-edit"><div class="edit-box"><textarea></textarea><div class="row">` +
      `<button class="btn sm" data-act="edit-cancel">${esc(t('cancel'))}</button>` +
      `<button class="btn sm${user ? '' : ' primary'}" data-act="edit-save">${esc(t('save'))}</button>` +
      (user ? `<button class="btn sm primary" data-act="edit-send">${esc(t('saveSend'))}</button>` : '') +
      `</div></div></div>`;
    el.querySelector('textarea').value = msg.content;
    return el;
  }
  if (msg.role === 'user') {
    if (msg.images && msg.images.length) {
      el.innerHTML = `<div class="images">${msg.images.map(src => `<img src="${esc(src)}" alt="">`).join('')}</div>`;
    }
    if (msg.content) {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = msg.content;
      el.append(bubble);
    }
    const foot = document.createElement('div');
    foot.className = 'msg-foot';
    el.append(foot);
    renderFoot(foot, chat, msg);
  } else {
    el.innerHTML = '<div class="bubble"></div><div class="msg-foot"></div>';
    renderAssistant(el, chat, msg);
  }
  return el;
}

// Finish reasons (OpenAI / Anthropic) that deserve a note under the reply.
const FINISH_NOTES = { length: 'truncated', max_tokens: 'truncated', content_filter: 'filtered', refusal: 'refused' };

// Updates an assistant message in place, so streaming keeps the <details> open state.
function renderAssistant(el, chat, msg) {
  const live = isLive(chat, msg);
  const bubble = el.querySelector('.bubble');
  const view = msg.reasoning ? { reasoning: msg.reasoning, content: msg.content } : splitThink(msg.content) || { reasoning: '', content: msg.content };
  const hasContent = !!view.content.trim();
  const thinking = live && !hasContent;

  let think = bubble.querySelector('.think');
  if (view.reasoning) {
    if (!think) {
      think = document.createElement('details');
      think.className = 'think';
      think.innerHTML = `<summary>${icon('down')}<span></span></summary><div class="think-body md"></div>`;
      think.open = thinking;
      bubble.prepend(think);
    }
    if (!thinking && think.open && !think.dataset.done) think.open = false; // collapse once the answer starts
    if (!thinking) think.dataset.done = '1';
    think.classList.toggle('live', thinking);
    think.querySelector('summary span').textContent = t(thinking ? 'thinking' : 'thoughts');
    think.querySelector('.think-body').innerHTML = md(view.reasoning);
  } else if (think) {
    think.remove();
  }

  let content = bubble.querySelector('.content');
  if (hasContent) {
    if (!content) {
      content = document.createElement('div');
      content.className = 'content md';
      bubble.append(content);
    }
    content.innerHTML = md(view.content);
  } else if (content) {
    content.remove();
  }

  bubble.querySelectorAll('.typing, .err, .notice').forEach(n => n.remove());
  if (live && !hasContent && !view.reasoning) bubble.insertAdjacentHTML('beforeend', '<div class="typing"><span></span><span></span><span></span></div>');
  if (msg.error) {
    const err = document.createElement('div');
    err.className = 'err';
    err.textContent = msg.error;
    bubble.append(err);
  }
  const note = live ? '' : msg.stopped ? 'stopped' : FINISH_NOTES.hasOwnProperty(msg.finish) ? FINISH_NOTES[msg.finish] : '';
  if (note) bubble.insertAdjacentHTML('beforeend', `<div class="notice">${esc(t(note))}</div>`);
  renderFoot(el.querySelector('.msg-foot'), chat, msg);
}

function renderFoot(foot, chat, msg) {
  const meta = [];
  if (msg.role === 'assistant') {
    if (msg.model) meta.push(msg.model);
    if (msg.usage && (msg.usage.input || msg.usage.output)) meta.push(t('usage', msg.usage.input, msg.usage.output));
    if (msg.ms) meta.push((msg.ms / 1000).toFixed(1) + 's');
  }
  const metaHtml = meta.length ? `<span class="meta" title="${esc(meta.join(' · '))}">${esc(meta.join(' · '))}</span>` : '';
  if (isLive(chat, msg)) { foot.innerHTML = metaHtml; return; }
  const last = chat.messages[chat.messages.length - 1] === msg;
  const actions = [['copy', 'copy', 'copy'], ['edit', 'edit', 'edit'], last && ['regen', 'redo', 'regenerate'], ['del', 'trash', 'delete']]
    .filter(Boolean)
    .map(([act, ic, label]) => `<button class="icon-btn" data-act="${act}" title="${esc(t(label))}" aria-label="${esc(t(label))}">${icon(ic)}</button>`);
  foot.innerHTML = `${metaHtml}<div class="msg-actions">${actions.join('')}</div>`;
}

function updateLive(chat, msg) {
  if (state.current !== chat) return;
  const el = ui.msgs.querySelector(`.msg[data-id="${CSS.escape(msg.id)}"]`);
  if (el) renderAssistant(el, chat, msg);
  if (state.stick) scrollToBottom();
  else syncScrollButton();
}

function updateComposer() {
  const running = state.running.has(state.current.id);
  ui.msgs.classList.toggle('busy', running);
  ui.send.innerHTML = icon(running ? 'stop' : 'up');
  ui.send.title = t(running ? 'stop' : 'send');
  ui.send.setAttribute('aria-label', ui.send.title);
  ui.send.disabled = !running && !ui.input.value.trim() && !state.attachments.length;
}

function renderThumbs() {
  ui.thumbs.hidden = !state.attachments.length;
  ui.thumbs.innerHTML = state.attachments.map((src, i) =>
    `<div class="thumb"><img src="${esc(src)}" alt=""><button data-i="${i}" title="${esc(t('remove'))}" aria-label="${esc(t('remove'))}">${icon('x')}</button></div>`
  ).join('');
}

function autosize(el = ui.input) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + el.offsetHeight - el.clientHeight + 'px';
}

function syncScrollButton() {
  const gap = ui.scroller.scrollHeight - ui.scroller.scrollTop - ui.scroller.clientHeight;
  ui.toBottom.hidden = gap < 150;
}
function scrollToBottom() {
  ui.scroller.scrollTop = ui.scroller.scrollHeight;
  state.stick = true;
  syncScrollButton();
}

// ---------- Chats ----------
function openChat(chat) {
  state.current = chat;
  state.editing = null;
  if (!chat.draft) rememberChat(chat);
  setTitle(chat);
  renderAll();
  scrollToBottom();
}

function newChat() {
  const cur = state.current;
  if (cur && cur.draft) {
    cur.options = { ...settings.defaults };
    openChat(cur);
  } else {
    openChat(makeChat());
  }
  closeSide();
  if (!isMobile()) ui.input.focus();
}

async function deleteChat(chat) {
  if (!confirm(t('deleteChatConfirm'))) return;
  const run = state.running.get(chat.id);
  if (run) run.ctrl.abort();
  state.chats = state.chats.filter(c => c !== chat);
  await store.deleteChat(chat.id).catch(e => toast(t('storageError', e.message || e)));
  if (state.current === chat) openChat(makeChat());
  else renderChatList();
}

function renameChat(chat) {
  const title = prompt(t('renamePrompt'), chat.title);
  if (title == null) return;
  chat.title = title.trim();
  saveChat(chat);
  renderChatList();
  if (chat === state.current) setTitle(chat);
}

// ---------- Sending ----------
function send() {
  const chat = state.current;
  const text = ui.input.value.trim();
  if (state.running.has(chat.id) || (!text && !state.attachments.length)) return;
  if (!resolveModel(chat)) { toast(t('noModel')); return; }
  const msg = { id: uid(), role: 'user', content: text, time: Date.now() };
  if (state.attachments.length) msg.images = state.attachments.splice(0);
  chat.messages.push(msg);
  if (!chat.title) chat.title = text.replace(/\s+/g, ' ').slice(0, 60);
  if (chat.draft) {
    delete chat.draft;
    state.chats.unshift(chat);
    rememberChat(chat);
  }
  // Ask once to keep data from being evicted (Firefox shows a prompt, so wait until the app is in use).
  if (!state.persistAsked && navigator.storage && navigator.storage.persist) {
    state.persistAsked = true;
    navigator.storage.persist().catch(() => {});
  }
  setTitle(chat);
  ui.input.value = '';
  autosize();
  renderThumbs();
  generate(chat);
}

async function generate(chat) {
  const target = resolveModel(chat);
  if (!target) { toast(t('noModel')); return; }
  const history = contextMessages(chat);
  chat.updated = Date.now();
  sortChats();
  saveChat(chat); // persist the user's message right away
  const msg = { id: uid(), role: 'assistant', content: '', model: target.model, time: Date.now(), partial: true };
  chat.messages.push(msg);
  const ctrl = new AbortController();
  state.running.set(chat.id, { ctrl, msg });
  if (state.current === chat) {
    renderMessages();
    updateComposer();
    scrollToBottom();
  }
  renderChatList();

  const started = performance.now();
  let frame = 0;
  let lastSave = Date.now();
  const onUpdate = () => {
    if (!frame) frame = requestAnimationFrame(() => { frame = 0; updateLive(chat, msg); });
    if (Date.now() - lastSave > 3000) { lastSave = Date.now(); saveChat(chat); }
  };
  try {
    await complete(target, chat.options, history, msg, onUpdate, ctrl.signal);
  } catch (e) {
    if (ctrl.signal.aborted) msg.stopped = true;
    else msg.error = (e && e.message) || String(e);
  }
  cancelAnimationFrame(frame);
  delete msg.partial;
  msg.ms = Math.round(performance.now() - started);
  if (!msg.reasoning) {
    const split = splitThink(msg.content);
    if (split) Object.assign(msg, split);
  }
  state.running.delete(chat.id);
  if (!state.chats.includes(chat)) return; // deleted while generating
  chat.updated = Date.now();
  saveChat(chat);
  if (state.current === chat) {
    updateLive(chat, msg);
    updateComposer();
  }
  renderChatList();
}

function stopChat(chat) {
  const run = state.running.get(chat.id);
  if (run) run.ctrl.abort();
}

function regenerate(chat, msg) {
  if (state.running.has(chat.id)) return;
  if (!resolveModel(chat)) { toast(t('noModel')); return; } // check before removing anything
  const i = chat.messages.indexOf(msg);
  chat.messages.splice(msg.role === 'assistant' ? i : i + 1);
  generate(chat);
}

async function addImages(files) {
  for (const file of files) {
    try { state.attachments.push(await readImage(file)); } catch (e) { toast(t('imageError')); }
  }
  renderThumbs();
  updateComposer();
}

function showImage(src) {
  ui.dlgImg.querySelector('img').src = src;
  ui.dlgImg.showModal();
}

// ---------- Chat settings dialog ----------
function openChatSettings() {
  const o = state.current.options;
  const target = resolveModel(state.current);
  const type = target ? target.provider.type : 'openai';
  $('#cs-system').value = o.system || '';
  $('#cs-temperature').value = o.temperature ?? '';
  $('#cs-topP').value = o.topP ?? '';
  $('#cs-maxTokens').value = o.maxTokens ?? '';
  $('#cs-context').value = o.context ?? '';
  $('#cs-temperature').placeholder = $('#cs-topP').placeholder = t('default');
  $('#cs-maxTokens').placeholder = type === 'anthropic' ? String(ANTHROPIC_DEFAULT_MAX_TOKENS) : t('default');
  $('#cs-context').placeholder = t('all');
  const efforts = type === 'anthropic' ? ['low', 'medium', 'high', 'xhigh', 'max'] : ['none', 'minimal', 'low', 'medium', 'high', 'xhigh'];
  if (o.reasoning && !efforts.includes(o.reasoning)) efforts.push(o.reasoning);
  $('#cs-reasoning').innerHTML = `<option value="">${esc(t('default'))}</option>` + efforts.map(v => `<option>${esc(v)}</option>`).join('');
  $('#cs-reasoning').value = o.reasoning || '';
  $('#cs-stream').checked = o.stream !== false;
  ui.dlgChat.showModal();
}

function readChatSettings() {
  return {
    system: $('#cs-system').value,
    temperature: toNum($('#cs-temperature').value),
    topP: toNum($('#cs-topP').value),
    maxTokens: toNum($('#cs-maxTokens').value, true),
    context: toNum($('#cs-context').value, true),
    reasoning: $('#cs-reasoning').value,
    stream: $('#cs-stream').checked,
  };
}

$('#cs-save').onclick = () => {
  Object.assign(state.current.options, readChatSettings());
  saveChat(state.current);
  ui.dlgChat.close();
};
$('#cs-default').onclick = () => {
  const values = readChatSettings();
  Object.assign(state.current.options, values);
  Object.assign(settings.defaults, values);
  saveChat(state.current);
  saveSettings();
  ui.dlgChat.close();
  toast(t('savedDefault'));
};

// ---------- Settings dialog ----------
function openSettings() {
  renderProviderList();
  $('#set-theme').value = settings.theme;
  $('#set-lang').value = settings.lang;
  $('#set-send').value = settings.sendKey;
  $('#version').textContent = t('version', VERSION);
  if (!ui.dlgSettings.open) ui.dlgSettings.showModal();
}

function renderProviderList() {
  $('#provider-list').innerHTML = settings.providers.length ? settings.providers.map(p =>
    `<button class="prov" data-id="${esc(p.id)}"><div><div class="p-name">${esc(p.name || hostOf(p))}</div>` +
    `<div class="p-sub">${esc(p.type === 'anthropic' ? 'Anthropic' : t('openaiCompatible'))} · ${esc(t(p.models.length === 1 ? 'oneModel' : 'modelCount', p.models.length))} · ${esc(hostOf(p))}</div></div>${icon('edit')}</button>`
  ).join('') : `<p class="hint">${esc(t('noProviders'))}</p>`;
}

$('#provider-list').addEventListener('click', e => {
  const item = e.target.closest('.prov');
  if (item) openProvider(settings.providers.find(p => p.id === item.dataset.id));
});
$('#btn-add-provider').onclick = () => openProvider(null);
$('#set-theme').onchange = e => { settings.theme = e.target.value; applyTheme(); saveSettings(); };
$('#set-lang').onchange = e => {
  settings.lang = e.target.value;
  applyLang();
  saveSettings();
  renderAll();
  openSettings();
};
$('#set-send').onchange = e => { settings.sendKey = e.target.value; saveSettings(); };

$('#btn-export').onclick = () => {
  const data = { app: 'JustChat', version: 1, exportedAt: new Date().toISOString(), settings, chats: state.chats };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = `justchat-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
};
$('#btn-import').onclick = () => $('#import-file').click();
$('#import-file').onchange = async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const chats = data && Array.isArray(data.chats) ? data.chats.filter(c => c && typeof c === 'object' && c.id) : [];
    if (!data || data.app !== 'JustChat' || (!data.settings && !chats.length)) throw new Error(t('badFile'));
    if (!confirm(t('importConfirm', chats.length))) return;
    for (const run of state.running.values()) run.ctrl.abort(); // their chat objects are about to be replaced
    state.chats = [];
    if (data.settings) await store.set('settings', normalizeSettings(data.settings));
    settings = normalizeSettings(data.settings || settings);
    for (const c of chats) await store.putChat(normalizeChat(c));
    await loadAll();
    openSettings(); // refresh the provider list and the selects
    toast(t('imported'));
  } catch (err) {
    toast(t('importFailed', err.message || err), 5000);
  }
};
$('#btn-clear').onclick = async () => {
  if (!confirm(t('clearConfirm'))) return;
  for (const run of state.running.values()) run.ctrl.abort();
  state.chats = [];
  await store.clear().catch(e => toast(t('storageError', e.message || e)));
  try {
    localStorage.removeItem('justchat-last');
    localStorage.removeItem('justchat-theme');
  } catch (e) { /* ignore */ }
  await loadAll();
  ui.dlgSettings.close();
};

// ---------- Provider dialog ----------
let editingProvider = null;
let fetchedModels = [];
let reopenSettings = false;
const parseModels = text => [...new Set(text.split(/[\n,]+/).map(s => s.trim()).filter(Boolean))];

function openProvider(p) {
  editingProvider = p || null;
  $('#pv-title').textContent = t(p ? 'editProvider' : 'newProvider');
  $('#pv-name').value = p ? p.name : '';
  $('#pv-type').value = p ? p.type : 'openai';
  $('#pv-url').value = p ? p.baseUrl : '';
  $('#pv-key').value = p ? p.apiKey : '';
  $('#pv-models').value = p ? p.models.join('\n') : '';
  $('#pv-headers').value = p ? p.headers : '';
  $('#pv-body').value = p ? p.body : '';
  $('#pv-delete').hidden = !p;
  $('#pv-picker').hidden = true;
  $('#dlg-provider details.adv').open = !!(p && (p.headers || p.body));
  updateEndpointHint();
  // Never stack two modal dialogs: hide Settings while editing and bring it back afterwards.
  reopenSettings = ui.dlgSettings.open;
  if (reopenSettings) ui.dlgSettings.close();
  ui.dlgProvider.showModal();
  // Start in the first field (the dialog would otherwise focus the close button). Not on touch screens,
  // where focusing would pop up the keyboard over the form.
  if (!matchMedia('(pointer: coarse)').matches) $('#pv-name').focus();
}

function closeProvider() {
  ui.dlgProvider.close();
  if (reopenSettings) {
    reopenSettings = false;
    openSettings();
  }
}
ui.dlgProvider.addEventListener('close', () => { // Esc, ×, Cancel or a backdrop click
  if (reopenSettings) {
    reopenSettings = false;
    openSettings();
  }
});

function readProviderForm() {
  return normalizeProvider({
    id: editingProvider ? editingProvider.id : uid(),
    name: $('#pv-name').value.trim(),
    type: $('#pv-type').value,
    baseUrl: $('#pv-url').value.trim(),
    apiKey: $('#pv-key').value.trim(),
    models: parseModels($('#pv-models').value),
    headers: $('#pv-headers').value.trim(),
    body: $('#pv-body').value.trim(),
  });
}

function validateProvider(p) {
  if (p.baseUrl && !/^https?:\/\//i.test(p.baseUrl)) throw new Error(t('invalidUrl'));
  parseObj(p.headers, t('extraHeaders'));
  parseObj(p.body, t('extraBody'));
}

function updateEndpointHint() {
  const p = { type: $('#pv-type').value, baseUrl: $('#pv-url').value.trim() };
  $('#pv-url').placeholder = DEFAULT_BASE[p.type];
  $('#pv-name').placeholder = hostOf(p);
  $('#pv-endpoint').textContent = p.baseUrl && !/^https?:\/\//i.test(p.baseUrl) ? t('invalidUrl') : t('endpoint', apiURL(p, 'chat'));
}
$('#pv-type').onchange = updateEndpointHint;
$('#pv-url').oninput = updateEndpointHint;

function renderPicker() {
  const q = $('#pv-filter').value.trim().toLowerCase();
  const chosen = new Set(parseModels($('#pv-models').value));
  $('#pv-picker-list').innerHTML = fetchedModels.filter(id => !q || id.toLowerCase().includes(q)).map(id =>
    `<label><input type="checkbox" value="${esc(id)}"${chosen.has(id) ? ' checked' : ''}>${esc(id)}</label>`
  ).join('');
}

$('#pv-fetch').onclick = async () => {
  const btn = $('#pv-fetch');
  const p = readProviderForm();
  btn.disabled = true;
  btn.textContent = t('fetching');
  try {
    validateProvider(p);
    fetchedModels = await fetchModels(p);
    // Small lists (e.g. a self-hosted server) are added right away; long ones are picked from the list.
    if (!p.models.length && fetchedModels.length <= 30) $('#pv-models').value = fetchedModels.join('\n');
    $('#pv-filter').value = '';
    $('#pv-picker').hidden = !fetchedModels.length;
    renderPicker();
    toast(t(fetchedModels.length === 1 ? 'fetchedOne' : 'fetchedN', fetchedModels.length));
  } catch (e) {
    toast(e.message || String(e), 6000);
  } finally {
    btn.disabled = false;
    btn.textContent = t('fetchModels');
  }
};
$('#pv-filter').oninput = renderPicker;
$('#pv-models').oninput = () => { if (!$('#pv-picker').hidden) renderPicker(); };
$('#pv-picker-list').addEventListener('change', e => {
  const id = e.target.value;
  const list = parseModels($('#pv-models').value).filter(m => m !== id);
  if (e.target.checked) list.push(id);
  $('#pv-models').value = list.join('\n');
});

$('#pv-save').onclick = () => {
  const p = readProviderForm();
  try {
    validateProvider(p);
    if (!p.models.length) throw new Error(t('needModel'));
  } catch (e) {
    toast(e.message, 4000);
    return;
  }
  if (editingProvider) Object.assign(editingProvider, p);
  else settings.providers.push(p);
  const d = settings.defaults;
  if (!settings.providers.some(x => x.id === d.providerId) || !d.model) {
    d.providerId = p.id;
    d.model = p.models[0];
  }
  if (!resolveModel(state.current)) Object.assign(state.current.options, { providerId: d.providerId, model: d.model });
  saveSettings();
  closeProvider();
  renderProviderList();
  renderModelSelect();
  renderMessages();
};

$('#pv-delete').onclick = () => {
  const p = editingProvider;
  if (!p || !confirm(t('deleteProviderConfirm', p.name || hostOf(p)))) return;
  settings.providers = settings.providers.filter(x => x !== p);
  if (settings.defaults.providerId === p.id) {
    const first = settings.providers[0];
    settings.defaults.providerId = first ? first.id : '';
    settings.defaults.model = first ? first.models[0] || '' : '';
  }
  saveSettings();
  closeProvider();
  renderProviderList();
  renderModelSelect();
  renderMessages();
};

// ---------- Events ----------
document.querySelectorAll('[data-close]').forEach(btn => { btn.onclick = () => btn.closest('dialog').close(); });
for (const dlg of document.querySelectorAll('dialog')) {
  // Close when a click starts and ends on the backdrop (not when a text selection drags out).
  let fromBackdrop = false;
  dlg.addEventListener('pointerdown', e => { fromBackdrop = e.target === dlg; });
  dlg.addEventListener('click', e => { if (fromBackdrop && e.target === dlg) dlg.close(); });
}
ui.dlgImg.addEventListener('click', () => ui.dlgImg.close());

$('#btn-side').onclick = () => {
  if (isMobile()) { document.body.classList.toggle('side-open'); return; }
  const hidden = document.body.classList.toggle('side-hidden');
  try { localStorage.setItem('justchat-side', hidden ? 'hidden' : ''); } catch (e) { /* ignore */ }
};
$('#overlay').onclick = closeSide;
$('#btn-new').onclick = newChat;
$('#btn-new2').onclick = newChat;
$('#btn-settings').onclick = () => { closeSide(); openSettings(); };
$('#btn-chat-settings').onclick = openChatSettings;
addEventListener('resize', () => { if (!isMobile()) closeSide(); });

ui.search.addEventListener('input', renderChatList);
ui.list.addEventListener('click', e => {
  const item = e.target.closest('.chat-item');
  const chat = item && state.chats.find(c => c.id === item.dataset.id);
  if (!chat) return;
  const act = e.target.closest('[data-act]');
  if (act && act.dataset.act === 'rename') return renameChat(chat);
  if (act && act.dataset.act === 'delete') return deleteChat(chat);
  if (chat !== state.current) openChat(chat);
  closeSide();
});

ui.model.addEventListener('change', () => {
  const value = ui.model.value;
  if (value === '__manage') {
    renderModelSelect();
    openSettings();
    return;
  }
  if (!value) return;
  const [providerId, model] = JSON.parse(value);
  const chat = state.current;
  fitModelSelect();
  Object.assign(chat.options, { providerId, model });
  Object.assign(settings.defaults, { providerId, model }); // the last used model becomes the default
  saveSettings();
  saveChat(chat);
  if (!chat.messages.length) renderMessages();
});

ui.msgs.addEventListener('click', async e => {
  const chat = state.current;
  const copyBtn = e.target.closest('.code-copy');
  if (copyBtn) {
    if (await copyText(copyBtn.closest('.code').querySelector('code').textContent)) {
      copyBtn.textContent = t('copied');
      setTimeout(() => { copyBtn.textContent = t('copy'); }, 1500);
    }
    return;
  }
  const img = e.target.closest('.images img, .md img');
  if (img) { showImage(img.src); return; }
  const btn = e.target.closest('[data-act]');
  if (!btn) {
    // Touch devices: tapping a message reveals its actions.
    const tapped = !e.target.closest('a, summary, textarea') && e.target.closest('.msg');
    if (tapped) tapped.classList.toggle('tapped');
    return;
  }
  const act = btn.dataset.act;
  if (act === 'add-provider') { openProvider(null); return; }
  const el = btn.closest('.msg');
  const msg = el && findMsg(chat, el.dataset.id);
  if (!msg || isLive(chat, msg)) return;
  const busy = state.running.has(chat.id);
  switch (act) {
    case 'copy':
      if (await copyText(msg.content)) toast(t('copied'));
      break;
    case 'edit': {
      if (busy) return;
      state.editing = msg.id;
      const box = messageEl(chat, msg);
      el.replaceWith(box);
      const ta = box.querySelector('textarea');
      autosize(ta);
      ta.focus();
      break;
    }
    case 'edit-cancel':
      state.editing = null;
      el.replaceWith(messageEl(chat, msg));
      break;
    case 'edit-save':
    case 'edit-send': {
      const value = el.querySelector('textarea').value;
      if (act === 'edit-send') {
        if (busy || (!value.trim() && !(msg.images && msg.images.length))) return;
        if (!resolveModel(chat)) { toast(t('noModel')); return; } // check before removing anything
        msg.content = value.trim();
        state.editing = null;
        chat.messages.splice(chat.messages.indexOf(msg) + 1);
        generate(chat);
      } else {
        msg.content = value;
        state.editing = null;
        saveChat(chat);
        el.replaceWith(messageEl(chat, msg));
      }
      break;
    }
    case 'regen':
      regenerate(chat, msg);
      break;
    case 'del':
      if (busy || !confirm(t('deleteMsgConfirm'))) return;
      chat.messages.splice(chat.messages.indexOf(msg), 1);
      saveChat(chat);
      renderMessages();
      break;
  }
});
ui.msgs.addEventListener('input', e => { if (e.target.matches('.edit-box textarea')) autosize(e.target); });
ui.msgs.addEventListener('keydown', e => {
  if (!e.target.matches('.edit-box textarea')) return;
  const el = e.target.closest('.msg');
  if (e.key === 'Escape') {
    e.preventDefault();
    el.querySelector('[data-act="edit-cancel"]').click();
  } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !e.isComposing) {
    e.preventDefault();
    (el.querySelector('[data-act="edit-send"]') || el.querySelector('[data-act="edit-save"]')).click();
  }
});

ui.scroller.addEventListener('scroll', () => {
  const gap = ui.scroller.scrollHeight - ui.scroller.scrollTop - ui.scroller.clientHeight;
  state.stick = gap < 40;
  ui.toBottom.hidden = gap < 150;
}, { passive: true });
ui.toBottom.onclick = () => ui.scroller.scrollTo({ top: ui.scroller.scrollHeight, behavior: 'smooth' });

ui.input.addEventListener('input', () => { autosize(); updateComposer(); });
ui.input.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.running.has(state.current.id)) { stopChat(state.current); return; }
  if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return; // 229: IME composition in Safari
  const mod = e.ctrlKey || e.metaKey;
  const enterSends = settings.sendKey === 'enter' && !matchMedia('(pointer: coarse)').matches;
  if (mod || (enterSends && !e.shiftKey && !e.altKey)) {
    e.preventDefault();
    send();
  }
});
ui.input.addEventListener('paste', e => {
  const cd = e.clipboardData;
  const files = cd ? [...cd.files].filter(f => f.type.startsWith('image/')) : [];
  if (files.length && !cd.getData('text/plain')) {
    e.preventDefault();
    addImages(files);
  }
});
ui.send.onclick = () => (state.running.has(state.current.id) ? stopChat(state.current) : send());
$('#btn-attach').onclick = () => ui.fileInput.click();
ui.fileInput.onchange = () => {
  addImages([...ui.fileInput.files]);
  ui.fileInput.value = '';
};
ui.thumbs.addEventListener('click', e => {
  const btn = e.target.closest('button[data-i]');
  if (!btn) return;
  state.attachments.splice(Number(btn.dataset.i), 1);
  renderThumbs();
  updateComposer();
});

const mainEl = $('main');
const hasFiles = e => !!e.dataTransfer && [...e.dataTransfer.types].includes('Files');
mainEl.addEventListener('dragover', e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  ui.composer.classList.add('drag');
});
mainEl.addEventListener('dragleave', e => { if (!mainEl.contains(e.relatedTarget)) ui.composer.classList.remove('drag'); });
mainEl.addEventListener('drop', e => {
  ui.composer.classList.remove('drag');
  if (!hasFiles(e)) return;
  e.preventDefault();
  addImages([...e.dataTransfer.files].filter(f => f.type.startsWith('image/')));
});
// Elsewhere (sidebar, dialogs) a dropped file must not make the browser navigate away from the app.
addEventListener('dragover', e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  if (!mainEl.contains(e.target)) e.dataTransfer.dropEffect = 'none';
});
addEventListener('drop', e => { if (hasFiles(e)) e.preventDefault(); });

// ---------- Startup ----------
async function loadAll() {
  settings = normalizeSettings(await store.get('settings').catch(() => null));
  state.chats = (await store.allChats().catch(() => [])).map(normalizeChat);
  sortChats();
  applyTheme();
  applyLang();
  let last = null;
  try { last = localStorage.getItem('justchat-last'); } catch (e) { /* ignore */ }
  openChat(state.chats.find(c => c.id === last) || makeChat());
}

// iOS ignores SVG icons for "Add to Home Screen", so draw a PNG once at startup.
function addTouchIcon() {
  try {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 180;
    const g = canvas.getContext('2d');
    g.fillStyle = '#1f1f1f';
    g.fillRect(0, 0, 180, 180);
    g.scale(180 / 64, 180 / 64);
    g.fillStyle = '#fff';
    g.fill(new Path2D('M17 16h30a6 6 0 0 1 6 6v16a6 6 0 0 1-6 6H31l-10 8v-8h-4a6 6 0 0 1-6-6V22a6 6 0 0 1 6-6z'));
    const link = document.createElement('link');
    link.rel = 'apple-touch-icon';
    link.href = canvas.toDataURL('image/png');
    document.head.append(link);
  } catch (e) { /* optional */ }
}

(async function init() {
  try { if (localStorage.getItem('justchat-side') === 'hidden') document.body.classList.add('side-hidden'); } catch (e) { /* ignore */ }
  await store.init();
  await loadAll();
  if (store.mode === 'memory') toast(t('storageMissing'), 6000);
  addTouchIcon();
  if (!isMobile()) ui.input.focus();
})();
